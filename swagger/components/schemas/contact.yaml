type: object
required:
  - _id
  - name
  - phoneNumber
  - email
  - isFavourite
  - contactType
  - photo
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 686a45082273ed27395e1931
  name:
    description: "Contact's name"
    type: string
    example: 'John Anderson'
  phoneNumber:
    description: "Contact's phone number"
    type: number
    example: +3452858194
  email:
    description: "Contact's email"
    type: string
    example: 'jonhanderson@gmail.com'
  isFavourite:
    description: 'Is contact favorite'
    type: boolean
    example: false
  contactType:
    description: "Contact's type"
    type: string
    enum: ['work', 'home', 'personal']
  photo:
    description: "Contact's photo"
    type: string
    example: https://res.cloudinary.com/uqwgdu/image/upload/image.png
  userId:
    description: "Contact's user id"
    type: string
    example: 686a45082273ed27395e1931
  createdAt:
    description: "Contact's create data"
    type: string
    example: '2025-07-06T09:42:32.201Z'
  updatedAt:
    description: "Contact's update data"
    type: string
    example: '2025-07-06T10:02:50.004Z'
